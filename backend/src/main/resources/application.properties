# Puerto HTTP; en servicios de hosting PORT suele venir definido por el proveedor.
server.port=${PORT:8080}
# Incluye mensajes útiles de validación en las respuestas de error.
server.error.include-message=always
# Origenes permitidos para CORS (separados por coma). En produccion: la URL de Vercel.
app.cors.origins=${CORS_ORIGINS:*}
# Cantidad de hilos "cajeros" que atienden ventas en paralelo
app.cajeros=${CAJEROS:4}

# PostgreSQL. Local defaults match docker-compose.yml.
# Configuración de PostgreSQL: estas opciones pueden sobrescribirse con variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ventas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ventas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ventas}
# Ejecuta schema.sql y data.sql al iniciar para crear tablas y sembrar el inventario.
spring.sql.init.mode=always
